version: "3.8"

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: automovilismo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: automovilismo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API FastAPI backend
  api:
    build: ./backend
    container_name: automovilismo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/automovilismo_db
      ENV: development
      DEBUG: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app

volumes:
  pg_data: