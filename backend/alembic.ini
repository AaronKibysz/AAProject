[alembic]
script_location = ./alembic
# sqlalchemy.url se carga desde Settings en env.py para consistencia

[loggers]
keys = root, alembic

[handlers]
keys = console

[formatters]
keys = generic

[formatter_generic]
format = "%(asctime)s %(levelname)s %(name)s %(message)s"

[logger_alembic]
level = INFO
handlers = console
qualname = alembic.runtime.migration

[task_alembic]